[project]
name = "example_pytest_bdd"
version = "0.1.0"
description = "Simple pytest-bdd example project"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
python_files = "test_*.py"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-bdd>=7.0"
]
